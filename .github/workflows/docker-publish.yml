name: Build and Publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Notify Telegram (start)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify CI start
        uses: ./.github/actions/telegram-notify
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "CI started: ${{ github.repository }} @ ${{ github.ref_name }} (sha=${{ github.sha }})"

  docker-frontend:
    name: Build and publish frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: vars
        run: |
          echo "safe_ref=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/abv-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/abv-frontend:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/abv-frontend:${{ steps.vars.outputs.safe_ref }}

      - name: Notify success
        if: success()
        uses: ./.github/actions/telegram-notify
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "Frontend image pushed: sha-${{ github.sha }}"

      - name: Notify failure
        if: failure()
        uses: ./.github/actions/telegram-notify
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "Frontend job failed: ${{ github.repository }} @ sha=${{ github.sha }}"

